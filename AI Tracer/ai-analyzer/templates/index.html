<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Activity Tracer</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
    background: #1a1a1a;
    color: #e0e0e0;
  }
  h1 { color: #fff; }
  .section {
    background: #2a2a2a;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .block-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  input, select {
    background: #1a1a1a;
    border: 1px solid #444;
    color: #e0e0e0;
    padding: 6px 10px;
    border-radius: 6px;
  }
  input[type="time"] { width: 100px; }
  input[type="text"] { flex: 1; }
  button {
    background: #4a7cff;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #3a6cef; }
  button.remove { background: #ff4a4a; padding: 6px 10px; }
  button.remove:hover { background: #ef3a3a; }
  #analyzeBtn {
    background: #4aff8c;
    color: #111;
    font-weight: bold;
    padding: 14px 24px;
    font-size: 16px;
    width: 100%;
  }
  #analyzeBtn:hover { background: #3aef7c; }
  #analyzeBtn:disabled { background: #555; color: #999; cursor: not-allowed; }
  .report {
    white-space: pre-wrap;
    line-height: 1.6;
    background: #1a1a1a;
    padding: 16px;
    border-radius: 8px;
    margin-top: 12px;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .summary-box { background: #1a1a1a; padding: 12px; border-radius: 8px; }
  .summary-box h3 { margin-top: 0; font-size: 14px; color: #aaa; }
  .loading { color: #4a7cff; font-style: italic; }
  
  /* Metrics Card styling */
  .metrics-container {
    display: flex;
    gap: 16px;
    margin-top: 15px;
    margin-bottom: 20px;
  }
  .metric-card {
    flex: 1;
    background: #1a1a1a;
    padding: 16px;
    border-radius: 8px;
    border: 1px solid #333;
    text-align: center;
  }
  .metric-title {
    color: #888;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.5px;
  }
  .metric-value {
    margin: 8px 0;
    font-size: 32px;
  }
  .metric-sub {
    font-size: 12px;
    color: #aaa;
    margin: 0;
  }
</style>
</head>
<body>

<h1>🧠 AI Activity Tracer</h1>

<div class="section">
  <h2>Your Schedule</h2>
  <div id="scheduleBlocks"></div>
  <button onclick="addBlock()">+ Add Block</button>
  <button onclick="saveSchedule()" style="margin-left: 8px; background: #666;">Save Schedule</button>
  <span id="saveStatus" style="margin-left: 10px; color: #4aff8c;"></span>
</div>

<div class="section">
  <h2>Trusted Channels</h2>
  <p style="color:#aaa; font-size:14px;">Channels here skip AI classification entirely - instant and always consistent.</p>
  <div id="trustedChannels"></div>
  <div style="display:flex; gap:8px; margin-top:10px;">
    <input type="text" id="newChannelName" placeholder="Channel name" style="flex:1;">
    <select id="newChannelCategory">
      <option value="study">study</option>
      <option value="entertainment">entertainment</option>
    </select>
    <button onclick="addTrustedChannel()">+ Add</button>
  </div>
  <button onclick="saveTrustedChannels()" style="margin-top:10px; background:#666;">Save Channels</button>
  <span id="channelSaveStatus" style="margin-left:10px; color:#4aff8c;"></span>
</div>

<div class="section">
  <div style="margin-bottom: 12px;">
    <label style="color: #aaa; font-size: 14px;">From:</label>
    <input type="date" id="analyzeDate" style="margin-left: 8px;">
    <label style="color: #aaa; font-size: 14px; margin-left: 12px;">To:</label>
    <input type="date" id="analyzeEndDate" style="margin-left: 8px;">
    <span style="color:#666; font-size: 12px; margin-left: 8px;">(leave "To" blank for single day)</span>
  </div>
  <button id="analyzeBtn" onclick="runAnalysis()">Analyze My Day</button>
  <div id="results"></div>
</div>

<script>
let schedule = { blocks: [] };

async function loadSchedule() {
  const res = await fetch("/api/schedule");
  schedule = await res.json();
  renderSchedule();
}

function renderSchedule() {
  const container = document.getElementById("scheduleBlocks");
  container.innerHTML = "";
  schedule.blocks.forEach((block, i) => {
    const row = document.createElement("div");
    row.className = "block-row";
    row.innerHTML = `
      <input type="time" value="${block.start}" onchange="updateBlock(${i}, 'start', this.value)">
      <span>to</span>
      <input type="time" value="${block.end}" onchange="updateBlock(${i}, 'end', this.value)">
      <input type="text" value="${block.activity}" placeholder="Activity name" onchange="updateBlock(${i}, 'activity', this.value)">
      <select onchange="updateBlock(${i}, 'category', this.value)">
        ${["study","health","personal","rest","leisure","other"].map(cat =>
          `<option value="${cat}" ${block.category === cat ? "selected" : ""}>${cat}</option>`
        ).join("")}
      </select>
      <button class="remove" onclick="removeBlock(${i})">✕</button>
    `;
    container.appendChild(row);
  });
}

function updateBlock(index, field, value) {
  schedule.blocks[index][field] = value;
}

function addBlock() {
  schedule.blocks.push({ start: "09:00", end: "10:00", activity: "New block", category: "other" });
  renderSchedule();
}

function removeBlock(index) {
  schedule.blocks.splice(index, 1);
  renderSchedule();
}

async function saveSchedule() {
  await fetch("/api/schedule", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(schedule)
  });
  const status = document.getElementById("saveStatus");
  status.textContent = "✓ Saved";
  setTimeout(() => status.textContent = "", 2000);
}

async function runAnalysis() {
  const btn = document.getElementById("analyzeBtn");
  const results = document.getElementById("results");
  btn.disabled = true;
  btn.textContent = "Analyzing... (this may take 1-2 minutes)";
  results.innerHTML = '<p class="loading">Fetching your activity and asking the local AI to think it through...</p>';

  try {
    const dateInput = document.getElementById("analyzeDate").value;
    const endDateInput = document.getElementById("analyzeEndDate").value;
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: dateInput || null, end_date: endDateInput || null })
    });
    const json = await res.json();

    if (!json.success) {
      results.innerHTML = `<p style="color:#ff4a4a;">Error: ${json.error}</p>`;
      return;
    }

    const data = json.data;

    let html = "";

    // 1. Productivity and Adherence Metrics Cards
    if (data.metrics) {
      html += `
        <div class="metrics-container">
          <div class="metric-card">
            <span class="metric-title">ROUTINE ADHERENCE</span>
            <h1 class="metric-value" style="color: #4a7cff;">${data.metrics.routine_adherence_percentage}</h1>
            <p class="metric-sub">Time following scheduled blocks</p>
          </div>
          <div class="metric-card">
            <span class="metric-title">PRODUCTIVITY SCORE</span>
            <h1 class="metric-value" style="color: #2ed573;">${data.metrics.productivity_percentage}</h1>
            <p class="metric-sub">${data.metrics.productive_time} productive time</p>
          </div>
        </div>
      `;
    }

    // 2. Browser Activities (Instagram & YouTube)
    html += '<div class="summary-grid">';
    html += '<div class="summary-box"><h3>Instagram</h3>';
    if (data.instagram_summary_formatted && Object.keys(data.instagram_summary_formatted).length > 0) {
      for (const [type, formatted] of Object.entries(data.instagram_summary_formatted)) {
        html += `<div>${type}: ${formatted}</div>`;
      }
    } else {
      html += '<div style="color:#aaa;">No activity</div>';
    }
    
    html += '</div><div class="summary-box"><h3>YouTube</h3>';
    if (data.youtube_summary_formatted && Object.keys(data.youtube_summary_formatted).length > 0) {
      for (const [type, formatted] of Object.entries(data.youtube_summary_formatted)) {
        html += `<div>${type}: ${formatted}</div>`;
      }
    } else {
      html += '<div style="color:#aaa;">No activity</div>';
    }
    html += '</div></div>';

    // 3. All Desktop Apps (Claude, Finder, Terminal, VS Code, Notes, etc.)
    if (data.others_summary_formatted && Object.keys(data.others_summary_formatted).length > 0) {
      html += '<h3 style="margin-top:20px;">Others (Desktop Apps)</h3><div class="summary-box">';
      for (const [app, formatted] of Object.entries(data.others_summary_formatted)) {
        html += `<div><strong>${app}</strong>: ${formatted}</div>`;
      }
      html += '</div>';
    }

    // 4. Drift Analysis by Schedule Block
    html += '<h3 style="margin-top:20px;">Drift by Schedule Block</h3>';
    for (const [block, cats] of Object.entries(data.block_drift)) {
      html += `<div class="summary-box" style="margin-bottom:8px;">
        <strong>${block}</strong><br>
        Entertainment: ${cats.entertainment} |
        Study: ${cats.study} |
        Ambiguous: ${cats.ambiguous}
      </div>`;
    }

    // 5. Unscheduled Activity
    if (data.unscheduled && (data.unscheduled.entertainment + data.unscheduled.study + data.unscheduled.ambiguous) > 2) {
      html += `<h3 style="margin-top:20px;">Outside Any Schedule Block</h3>
        <div class="summary-box" style="margin-bottom:8px;">
          Entertainment: ${data.unscheduled_formatted.entertainment} |
          Study: ${data.unscheduled_formatted.study} |
          Ambiguous: ${data.unscheduled_formatted.ambiguous}
          <div style="color:#aaa; font-size:12px; margin-top:4px;">(This activity happened outside your defined schedule - e.g. late night or early morning)</div>
        </div>`;
    }

    // 6. AI Summary Report
    html += `<h3 style="margin-top:20px;">Your Report</h3><div class="report">${data.report}</div>`;

    results.innerHTML = html;
  } catch (err) {
    results.innerHTML = `<p style="color:#ff4a4a;">Failed to reach the server: ${err.message}</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Analyze My Day";
  }
}

loadSchedule();
document.getElementById("analyzeDate").value = new Date().toISOString().split("T")[0];

let trustedChannels = { study_channels: [], entertainment_channels: [] };

async function loadTrustedChannels() {
  const res = await fetch("/api/trusted-channels");
  trustedChannels = await res.json();
  renderTrustedChannels();
}

function renderTrustedChannels() {
  const container = document.getElementById("trustedChannels");
  container.innerHTML = "";
  trustedChannels.study_channels.forEach((name, i) => {
    container.appendChild(makeChannelRow(name, "study", i));
  });
  trustedChannels.entertainment_channels.forEach((name, i) => {
    container.appendChild(makeChannelRow(name, "entertainment", i));
  });
}

function makeChannelRow(name, category, index) {
  const row = document.createElement("div");
  row.className = "block-row";
  const badgeColor = category === "study" ? "#4aff8c" : "#ff9a4a";
  row.innerHTML = `
    <span style="flex:1;">${name}</span>
    <span style="color:${badgeColor}; font-size:12px; padding:2px 8px; border:1px solid ${badgeColor}; border-radius:10px;">${category}</span>
    <button class="remove" onclick="removeTrustedChannel('${category}', ${index})">✕</button>
  `;
  return row;
}

function addTrustedChannel() {
  const name = document.getElementById("newChannelName").value.trim();
  const category = document.getElementById("newChannelCategory").value;
  if (!name) return;
  if (category === "study") {
    trustedChannels.study_channels.push(name);
  } else {
    trustedChannels.entertainment_channels.push(name);
  }
  document.getElementById("newChannelName").value = "";
  renderTrustedChannels();
}

function removeTrustedChannel(category, index) {
  if (category === "study") {
    trustedChannels.study_channels.splice(index, 1);
  } else {
    trustedChannels.entertainment_channels.splice(index, 1);
  }
  renderTrustedChannels();
}

async function saveTrustedChannels() {
  await fetch("/api/trusted-channels", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(trustedChannels)
  });
  const status = document.getElementById("channelSaveStatus");
  status.textContent = "✓ Saved";
  setTimeout(() => status.textContent = "", 2000);
}

loadTrustedChannels();
</script>

</body>
</html>
